global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["host.docker.internal:15692"]

  - job_name: "order-service"
    static_configs:
      - targets: ["host.docker.internal:7230"]

  - job_name: "inventory-service"
    static_configs:
      - targets: ["host.docker.internal:8001"]
